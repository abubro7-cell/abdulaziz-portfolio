<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ko‘nikmalarim | Abdulaziz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffffff, #eef3ff);
            color: #172033;
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(40, 65, 120, 0.12);
        }

        .skill {
            display: inline-block;
            background: #eef1ff;
            padding: 18px 25px;
            margin: 8px;
            border-radius: 14px;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-5px);
            background: #dfe5ff;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #4776e6, #8e54e9);
            color: white;
            text-decoration: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Mening ko‘nikmalarim</h1>
        <p>Men o‘rganayotgan dasturlash tillari va texnologiyalar:</p>

        <div class="skill">🌐 HTML</div>
        <div class="skill">🎨 CSS</div>
        <div class="skill">🐍 Python</div>
        <div class="skill">💻 C++</div>
        <div class="skill">🗄️ SQL</div>

        <p>Hozir ushbu texnologiyalarni bosqichma-bosqich o‘rganyapman.</p>

        <a href="index.html">Bosh sahifaga qaytish</a>
    </div>
</body>
</html>
